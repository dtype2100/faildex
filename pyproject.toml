[project]
name = "faildex"
version = "0.1.0"
description = "A failure index for coding agents: recurring failures and their fixes, in an embedded Relate graph."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.2",
    "relate-db==1.0.1",
]

[project.scripts]
faildex = "faildex.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faildex"]

# The public demo store ships inside the package, so `faildex demo` works after
# any install. Only the committed files: lock files and the WAL are per machine.
[tool.hatch.build.targets.wheel.force-include]
"store/manifest.json" = "faildex/_store/manifest.json"
"store/nodes" = "faildex/_store/nodes"
"store/relationships" = "faildex/_store/relationships"
"store/.cypherlite" = "faildex/_store/.cypherlite"
"skills/faildex/SKILL.md" = "faildex/_skills/faildex/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
