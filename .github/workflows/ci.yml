name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: make site
      - run: uv run pytest -q -rs
      - run: make demo

  # Windows: install and run the CLI (the browser demo build needs make and is skipped).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
      - run: uv run faildex demo
      - run: ./install.ps1
        shell: pwsh
        env:
          FAILDEX_SOURCE: .
      - run: faildex check "git status"
